[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-recall"
version = "0.1.0"
description = "Local-first, agent-neutral memory with explicit writes and selective recall."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8,<0.9",
    "huggingface-hub>=0.20,<2",
    "numpy>=1.26,<3",
    "onnxruntime>=1.24.2,<2",
]

[project.scripts]
memory = "pocket_recall.cli:main"

[project.optional-dependencies]
dev = [
    "black>=26",
    "isort>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
skip-string-normalization = true
target-version = ["py311"]

[tool.ruff.lint]
ignore = ["I001"]
